name: CI

# Keep in sync with scripts/deployment/vercel-ignore-build.sh.

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@noemiko"
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
      - run: npx astro sync
      - run: npm test
      - run: npm ci --prefix scripts/review --ignore-scripts
      - run: node --test scripts/review/review.test.mjs
      - run: npm run lint
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  decimal-transport:
    name: Decimal transport (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@noemiko"
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: CLI v3 rejects [inbucket] in supabase/config.toml. Keep the major in step with the
          # `supabase` devDependency in package.json, and migrate the config before moving to v3.
          version: 2.122.0
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
      - run: npx astro sync
      - name: Start local Supabase
        # Startup prints local credentials; keep them out of the Actions log.
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor > /dev/null 2>&1
      - name: Prove exact decimal transport and service round trips
        run: npm run test:decimal-db
      - name: Verify versioned wallet cron infrastructure
        run: npm run test:wallet-cron
      - name: Verify manual price recovery template
        run: npm run test:recovery-db
      - name: Verify owner-created accounts sign in through Supabase Auth
        run: npm run test:user-create-db
      - name: Verify every table is reachable only by its owner, and every policy is granted
        run: npm run test:contract-db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  decision-history:
    name: Past investment reasons (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@noemiko"
      - uses: supabase/setup-cli@v1
        with:
          # Keep aligned with decimal-transport: CLI v3 rejects the current [inbucket] config.
          version: 2.122.0
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Start local Supabase
        # Startup prints local credentials; keep them out of the Actions log.
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor > /dev/null 2>&1
      - name: Configure the app for local Supabase
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { writeFileSync } from "node:fs";
          const status = JSON.parse(execFileSync("supabase", ["status", "-o", "json"], {
            encoding: "utf8",
            stdio: ["ignore", "pipe", "pipe"],
          }));
          const url = new URL(status.API_URL);
          if (url.protocol !== "http:" || !["127.0.0.1", "localhost", "[::1]"].includes(url.hostname) || !status.ANON_KEY) {
            throw new Error("Decision-history CI requires a running local Supabase stack");
          }
          writeFileSync(".env", `SUPABASE_URL=${url.origin}\nSUPABASE_KEY=${status.ANON_KEY}\n`, { mode: 0o600 });
          NODE
      - run: npx astro sync
      - name: Prove past reasons appear before saving an investment
        run: npx playwright test --project=decision-history
      - name: Preserve browser reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-history-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  smoke:
    # Slow (local Supabase); runs after merge to master only, not on PRs.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@noemiko"
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: CLI v3 rejects [inbucket] in supabase/config.toml. Keep the major in step with the
          # `supabase` devDependency in package.json, and migrate the config before moving to v3.
          version: 2.122.0
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Configure secrets
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
      - run: npm run build
      - name: Run smoke test against dev server
        run: |
          npm run dev -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup
