name: CI

# Docs-only changes (docs/, *.md) skip CI. Operator SQL under context/ is code.
# Keep in sync with scripts/deployment/vercel-ignore-build.sh.

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm test
      - run: npm run lint
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  decimal-transport:
    name: Decimal transport (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx astro sync
      - name: Start local Supabase
        # Startup prints local credentials; keep them out of the Actions log.
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor > /dev/null 2>&1
      - name: Prove exact decimal transport and service round trips
        run: npm run test:decimal-db
      - name: Verify versioned wallet cron infrastructure
        run: npm run test:wallet-cron
      - name: Verify market migrations and manual recovery
        run: npm run test:market-prices-db
      - name: Verify every RLS policy is backed by a grant
        run: npm run test:grants-db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  smoke:
    # Slow (local Supabase); runs after merge to master only, not on PRs.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - run: npm run test:wallet-db
      - name: Configure secrets
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
      - run: npm run build
      - name: Run smoke test against dev server
        run: |
          npm run dev -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup
